[project]
name = "apris-rover-server"
version = "0.1.0"
description = "APRIS rover local server and simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
apris-doctor = "apris_server.doctor:main"
apris-physicode-bridge = "apris_server.physicode_bridge:main"

[dependency-groups]
dev = [
  "httpx2>=2.9.1",
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apris_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
