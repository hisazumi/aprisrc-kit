[platformio]
src_dir = ROS_Driver

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DICM_20948_USE_DMP
    -DBIT_MODE_9=INA219_BIT_MODE_9
    -DPG_320=INA219_PG_320
    -DBRNG_16=INA219_BRNG_16
    -Wno-error=return-type
lib_deps =
    symlink://SCServo
    bblanchon/ArduinoJson@6.21.6
    adafruit/Adafruit SSD1306@2.5.17
    wollewald/INA219_WE@1.4.1
    madhephaestus/ESP32Encoder@5.0.0
    git+https://github.com/imax9000/Arduino-PID-Library.git#e9472b4
    denyssene/SimpleKalmanFilter@0.1.0
    git+https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git#32cf061
lib_archive = no

[env:apris]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DAPRIS_ROVER_ENABLED=1
lib_deps =
    ${env:esp32dev.lib_deps}
    links2004/WebSockets@2.7.2
