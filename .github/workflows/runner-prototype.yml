name: Runner prototype
on:
  push:
    branches: [next-platform]
    paths:
      - 'apps/runner-prototype/**'
      - 'apps/pwa/src/**'
      - 'package*.json'
      - '.github/workflows/runner-prototype.yml'
  pull_request:
    paths:
      - 'apps/runner-prototype/**'
      - 'apps/pwa/src/**'
      - 'package*.json'
      - '.github/workflows/runner-prototype.yml'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc -p apps/runner-prototype/tsconfig.json
      - run: node --test apps/runner-prototype/*.test.ts
      - run: node apps/runner-prototype/demo.ts
