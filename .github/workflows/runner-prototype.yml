name: Runner prototype
on:
  push:
    branches: [next-platform]
    paths:
      - 'apps/runner-prototype/**'
      - 'apps/pwa/src/**'
      - 'apps/server/**'
      - 'package*.json'
      - '.github/workflows/runner-prototype.yml'
  pull_request:
    paths:
      - 'apps/runner-prototype/**'
      - 'apps/pwa/src/**'
      - 'apps/server/**'
      - 'package*.json'
      - '.github/workflows/runner-prototype.yml'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc -p apps/runner-prototype/tsconfig.json
      - run: node --test apps/runner-prototype/*.test.ts
      - run: node apps/runner-prototype/demo.ts

  python-port:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --directory apps/server --frozen
      - run: uv run --directory apps/server ruff check src/apris_server/runner_port_experiment.py tests/test_runner_port_experiment.py
      - run: uv run --directory apps/server pytest tests/test_runner_port_experiment.py tests/test_runtime.py
      - run: node --test apps/runner-prototype/*.test.ts
        env:
          APRIS_PYTHON: ${{ github.workspace }}/apps/server/.venv/bin/python
      - run: node apps/runner-prototype/python-demo.ts
        env:
          APRIS_PYTHON: ${{ github.workspace }}/apps/server/.venv/bin/python
